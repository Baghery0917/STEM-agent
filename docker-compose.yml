services:
  db:
    image: pgvector/pgvector:pg16
    container_name: stem-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stem_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # 仅本机联调；生产建议改成 "127.0.0.1:5432:5432" 或去掉 ports、只走 stem-net
    ports:
      - "5432:5432"
    networks:
      - default
      - stem-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stem_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: stem-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/stem_db
      DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/stem_db
      APP_ENV: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: http://localhost,http://127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    container_name: stem-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:

# stem-net：同机外部服务（策略/评价）直连 stem-db:5432
# 文档：docs/external-interfaces.md §0 ；make up / make network 会创建该网络
networks:
  stem-net:
    external: true
