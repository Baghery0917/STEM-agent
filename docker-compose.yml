services:
  db:
    image: pgvector/pgvector:pg16
    container_name: stem-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stem_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stem_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: stem-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/stem_db
      DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/stem_db
      APP_ENV: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: http://localhost,http://127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    container_name: stem-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
