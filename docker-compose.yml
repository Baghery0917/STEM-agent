services:
  db:
    image: pgvector/pgvector:pg16
    container_name: stem-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stem_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stem_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: stem-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/stem_db
      DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/stem_db
      PGVECTOR_DIMENSION: 1024
      APP_ENV: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: http://localhost,http://127.0.0.1
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-}
      LLM_EMBEDDING_DIMENSION: ${LLM_EMBEDDING_DIMENSION:-1024}
      EMOTION_BASE_URL: ${EMOTION_BASE_URL:-}
      EMOTION_API_KEY: ${EMOTION_API_KEY:-}
      TEACHING_STRATEGY_BASE_URL: ${TEACHING_STRATEGY_BASE_URL:-}
      TEACHING_STRATEGY_API_KEY: ${TEACHING_STRATEGY_API_KEY:-}
      TEACHING_REFERENCE_SIMILARITY_THRESHOLD: ${TEACHING_REFERENCE_SIMILARITY_THRESHOLD:-0.8}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    container_name: stem-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
